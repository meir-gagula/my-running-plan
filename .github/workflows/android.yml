name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css engine.js app.js icon.svg icon-192.png icon-512.png www/
      - name: Add Android project
        run: npx cap add android
      - name: Permissions and version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
      - name: App icons
        run: npx @capacitor/assets generate --android
      - name: Signing key (kept between builds so updates install over the old app)
        run: |
          mkdir -p ~/.android
          if gh release download signing -p debug.keystore -D ~/.android --repo "$GITHUB_REPOSITORY"; then
            echo "reusing key"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            gh release create signing ~/.android/debug.keystore --repo "$GITHUB_REPOSITORY" --title "signing key" --notes "Signing key so new versions install over the old one. Do not delete." --latest=false
          fi
      - name: Use the saved key for signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Check the APK is signed with the saved key
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          A=$($AS verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
          K=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep "SHA256:" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "apk=$A"; echo "key=$K"
          [ -n "$A" ] && [ "$A" = "$K" ]
      - name: Publish
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk running-plan.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest running-plan.apk --repo "$GITHUB_REPOSITORY" --title "Running plan app (build ${{ github.run_number }})" --notes "Android app. Download running-plan.apk and install." --latest
